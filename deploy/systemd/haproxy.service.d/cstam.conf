# Drop-in for the haproxy package unit: the master CLI socket the agent reloads through
# (group haproxy, mode 660), and the directory of both sockets.
[Unit]
After=cstam-gw-bootstrap.service
Requires=cstam-gw-bootstrap.service

[Service]
RuntimeDirectory=haproxy
RuntimeDirectoryMode=0755
ExecStartPre=
ExecStartPre=/usr/sbin/haproxy -c -q -f /etc/haproxy/haproxy.cfg
ExecStart=
ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -p /run/haproxy.pid -S /run/haproxy/master.sock,mode,660,group,haproxy
